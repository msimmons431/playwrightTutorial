name: Run Pytest
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      # Step 1 Checkout repo code
      - name: Checkout code
        uses: actions/checkout@v4
      # Step 2 Setup Python version
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      # Step 3 Install pytest and project dependencies.
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest
          pip install pytest-playwright
          playwright install --with-deps
          sudo apt-get install -y xvfb
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
      # Step 4 Run Tests
      - name: Test with pytest
        run: |
          xvfb-run pytest  -sv .
  deploy-or-report:
    runs-on: ubuntu-latest
    needs: test # This enforces the dependency rule
    steps:
      - name: Sync artifact or report status
        run: echo "Pytest job passed successfully. Proceeding with deployment tasks..."

